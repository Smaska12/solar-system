<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Солнечная система</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="space">
        <div class="sun"></div>

        <!-- Орбита Меркурия -->
        <div class="orbit mecury-orbit">
            <!-- Сама планета -->
            <div class="mecury"></div>
        </div>
        
        <div class="orbit venus-orbit">
            <div class="venus"></div>
        </div>

        <div class="orbit earth-orbit">
            <div class="earth"></div>
        </div>
        
        <div class="orbit mars-orbit">
            <div class="mars"></div>
        </div>

        <div class="orbit jupiter-orbit">
            <div class="jupiter"></div>
        </div>

        <div class="orbit saturn-orbit">
            <div class="saturn"></div>
        </div>

        <div class="orbit uranus-orbit">
            <div class="uranus"></div>
        </div>

        <div class="orbit neptune-orbit">
            <div class="neptune"></div>
        </div>

        <div class="orbit pluto-orbit">
            <div class="pluto"></div>
        </div>

        <canvas id="stars"></canvas>
    </div>

    <script src="script/script.js"></script>
</body>
</html>
